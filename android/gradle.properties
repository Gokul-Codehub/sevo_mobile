# Sized for an 8 GB laptop (the old -Xmx8G / 4G metaspace starved the Dart
# compiler and made `flutter run` crash with Out of Memory). Raise these only
# on a machine with plenty of free RAM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Disable Kotlin incremental compilation cross-drive relative path calculations
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

